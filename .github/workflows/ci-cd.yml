name: CI/CD Pipeline

on:
  push:
    branches: [ v3 ]
  pull_request:
    branches: [ v3 ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: predict_logs_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install uv, ruff and bandit
        run: |
          python -m pip install uv ruff bandit
          cd ml-service && uv sync --dev
          cd ../etl && uv sync --dev
      - name: Lint with ruff
        run: ruff check ml-service/src etl/src --output-format=github
      - name: Security check with bandit
        run: bandit -r ml-service/src etl/src -x ./ml-service/tests,./etl/tests,./.venv -f json -o bandit-report.json || true
      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
      - name: Test with pytest
        env:
          DB_HOST: localhost
          DB_USER: postgres
          PGPASSWORD: 1234
          DB_NAME: predict_logs_db
          OLLAMA_HOST: localhost:11434
        run: pytest ml-service/tests/ -v

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/v3'
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
      - name: Build and push ML Service Image
        uses: docker/build-push-action@v4
        with:
          context: ./ml-service
          file: ./ml-service/Dockerfile
          push: true
          tags: |
            ghcr.io/avandrevv/ml-service:${{ steps.vars.outputs.sha_short }}
            ghcr.io/avandrevv/ml-service:v3.1
      - name: Build and push ETL Image
        uses: docker/build-push-action@v4
        with:
          context: ./etl
          file: ./etl/Dockerfile.etl
          push: true
          tags: |
            ghcr.io/avandrevv/etl-service:${{ steps.vars.outputs.sha_short }}
            ghcr.io/avandrevv/etl-service:v3.1