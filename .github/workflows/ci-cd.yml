name: CI/CD Pipeline

on:
  push:
    branches: [ v4 ]
  pull_request:
    branches: [ v4 ]
  workflow_dispatch:

jobs:
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            ml-service/uv.lock
            etl/uv.lock

      - name: Sync dependencies
        run: |
          cd ml-service && uv sync
          cd ../etl && uv sync

      - name: Ruff
        run: |
           cd ml-service && uv run ruff check src ../etl/src \
            --output-format=json > ../ruff-report.json || true

      - name: Bandit
        run: |
           cd ml-service && uv run bandit -r ml-service/src etl/src \
            -x ml-service/tests,etl/tests,ml-service/.venv,etl/.venv \
            -f json -o ../bandit-report.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-reports
          path: |
            ruff-report.json
            bandit-report.json

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: predict_logs_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            ml-service/uv.lock
            etl/uv.lock

      - name: Sync dependencies
        run: |
          cd ml-service && uv sync
          cd ../etl && uv sync

      - name: Copy model files
        run: |
          cp model.joblib ml-service/
          cp scaler.joblib ml-service/

      - name: Pytest with coverage
        run: |
          cd ml-service && \
          DB_HOST=localhost DB_USER=postgres PGPASSWORD=1234 \
          DB_NAME=predict_logs_db OLLAMA_HOST=localhost:11434 \
          uv run pytest tests/ -v \
            --cov=src --cov-report=xml --cov-report=term-missing

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: ml-service/coverage.xml

  build:
    name: Build & Push
    needs: [ static-checks, test ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/v4'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./ml-service
          file: ./ml-service/Dockerfile
          push: true
          tags: |
            ghcr.io/avandrevv/ml-service:v4.0.1-${{ github.run_id }}.${{ github.run_attempt }}
            ghcr.io/avandrevv/ml-service:v4.0.1

      - uses: docker/build-push-action@v6
        with:
          context: ./etl
          file: ./etl/Dockerfile.etl
          push: true
          tags: |
            ghcr.io/avandrevv/etl-service:v4.0.1-${{ github.run_id }}.${{ github.run_attempt }}
            ghcr.io/avandrevv/etl-service:v4.0.1

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [ static-checks, test, build ]
    if: always()
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Run Quality Gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python .github/scripts/quality_gate.py